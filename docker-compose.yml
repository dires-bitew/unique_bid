services:

  db:
    image: postgres:18.6-alpine
    container_name: unique_bid_postgres

    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    shm_size: 128mb


volumes:
  postgres_data: